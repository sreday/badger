{{define "actions.html"}}{{template "layout" .}}{{end}}
{{define "content"}}
<h1>Open actions</h1>
<div class="card">
    {{if not .Actions}}<p class="muted">Nothing open.</p>{{end}}
    <ul>
    {{range .Actions}}
        <li class="step">
            <form class="tick" method="post" action="{{$.Base}}/admin/call/{{.Call.ID}}/tick/{{.I}}">
                <input type="hidden" name="done" value="1">
                <input type="checkbox" onclick="if(!window.fetch){this.form.submit()}">
            </form>
            <span>{{.Text}}<br><a class="muted" href="{{$.Base}}/admin/call/{{.Call.ID}}">{{.Call.Title}} · {{fmtTime .Call.Start $.TZ}}</a></span>
        </li>
    {{end}}
    </ul>
</div>
{{end}}
