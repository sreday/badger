{{define "content"}}
<h1>Print your event's badges</h1>
<div class="sub">Sign in with Luma, or bring a guest list.</div>

{{if .Error}}<div class="error">{{.Error}}</div>{{end}}

<div class="card glass">
    <h2>Login</h2>
    <p style="margin-bottom:16px">Enter your <a href="https://lu.ma/calendar/manage/api-keys">Lu.ma API key</a></p>
    <form action="{{base}}/luma" method="POST">
        <label for="key">Key</label>
        <input type="text" id="key" name="key" required>
        <button type="submit">Submit</button>
    </form>
</div>

<div class="card glass">
    <h2>CSV Import</h2>
    <p style="margin-bottom:16px">Or upload a guest list CSV file (Luma export format)</p>
    <form action="{{base}}/csv" method="POST" enctype="multipart/form-data">
        <label for="csv">CSV file</label>
        <input type="file" id="csv" name="csv" accept=".csv" required
               style="width:100%;padding:8px 0;margin-bottom:12px;">
        <button type="submit">Upload</button>
    </form>
</div>
{{end}}

{{template "layout" .}}
