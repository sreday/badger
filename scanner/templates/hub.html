{{define "hub.html"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badger</title>
<link rel="icon" type="image/png" href="/assets/badger-favicon.png">
<link rel="apple-touch-icon" href="/assets/snout-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
    /* The Badger hub: the logo, and one button per tool. Each tool asks for
       its own login. */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #111; --orange: #ec7a2c; }
    body { min-height: 100vh; color: var(--ink); font-family: 'Fredoka', sans-serif;
           background: linear-gradient(160deg, #f8f9fb 0%, #ece7f0 100%);
           display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6vh 20px; }
    .logo { position: relative; width: min(720px, 92vw); margin-bottom: 7vh; }
    .logo img { width: 100%; height: auto; display: block; }
    /* the orange frame round the head, cut from the logo (badger-frame.webp,
       its box on the 1600x451 logo), breathes: a little bigger, then back */
    .logo .frame { position: absolute; left: .0625%; top: .2217%; width: 28.3125%; height: 98.0044%;
                   animation: breathe 4.5s ease-in-out infinite alternate; }
    @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.045); } }
    @media (prefers-reduced-motion: reduce) { .logo .frame { animation: none; } }
    /* eyelids: black discs that slide down over the logo's white eyes
       (centres measured on the 1600x451 webp), clipped to the eye so the
       lid's round edge sweeps across it. Blinks and winks come from the
       script, at random. */
    .lid { position: absolute; top: 50.67%; width: 2.3%; height: 8.2%; border-radius: 50%; overflow: hidden; }
    .lid::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: #0f0f0f;
                   transform: translateY(-101%); }
    .lid.l { left: 8.07%; }
    .lid.r { left: 18.07%; }
    .lid.blink::before { animation: shut .34s ease-in-out; }
    .lid.wink::before { animation: wink .75s ease-in-out; }
    @keyframes shut {
        0%, 100% { transform: translateY(-101%); }
        45%, 55% { transform: translateY(0); }
    }
    @keyframes wink {
        0%, 100% { transform: translateY(-101%); }
        22%, 72% { transform: translateY(0); }
    }
    .tools { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 18px; width: min(940px, 100%); }
    .tool { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
            padding: 22px 12px 20px; border-radius: 18px; background: rgba(255,255,255,.55);
            color: var(--ink); text-decoration: none; transition: background .15s; }
    .tool .n { font-weight: 700; font-size: clamp(2rem, 4vw, 2.6rem); line-height: 1; letter-spacing: -.01em; }
    .tool .n small { font-size: .55em; vertical-align: .35em; margin-left: .15em; }
    .tool .by { font-weight: 600; font-size: 1rem; line-height: 1.2; opacity: .85; }
    /* the logo's scan-frame corners */
    .tool::before, .tool::after { content: ""; position: absolute; width: 22px; height: 22px; border: 4px solid var(--orange); transition: top .15s, left .15s, bottom .15s, right .15s; }
    .tool::before { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
    .tool::after { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
    .tool:hover, .tool:focus-visible { background: #fff; outline: none; }
    .tool:hover::before, .tool:focus-visible::before { top: -6px; left: -6px; }
    .tool:hover::after, .tool:focus-visible::after { bottom: -6px; right: -6px; }
    @media (max-width: 760px) { .tools { grid-template-columns: repeat(2, 1fr); } }
    /* What the tool under the pointer does: one sentence under the row,
       word by word, rising into place. The line keeps its height, so
       nothing moves. */
    .what { min-height: 2.6em; margin-top: 26px; width: min(940px, 100%); text-align: center;
            font-weight: 600; font-size: clamp(1.05rem, 2vw, 1.3rem); line-height: 1.3; }
    .what span { display: inline-block; opacity: 0; transform: translateY(.5em); filter: blur(3px);
                 animation: word .42s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes word { to { opacity: 1; transform: none; filter: none; } }
    @media (prefers-reduced-motion: reduce) { .what span { animation: none; opacity: 1; transform: none; filter: none; } }
</style>
</head>
<body>
    <div class="logo"><img src="/assets/badger-logo-body.webp" alt="Badger"><img class="frame" src="/assets/badger-frame.webp" alt=""><span class="lid l"></span><span class="lid r"></span></div>
    <nav class="tools">
        <a class="tool" href="/badger/" data-what="Prints everyone's badge at the door the moment their ticket is scanned."><span class="n">sett</span><span class="by">badge printing</span></a>
        <a class="tool" href="/admin" data-what="Sponsors scan attendees' badges and take their leads home."><span class="n">snout</span><span class="by">badge scanning</span></a>
        <a class="tool" href="/sniff" data-what="The audience asks, votes and rates every talk, live, from one QR."><span class="n">sniff</span><span class="by">speakers' Q&amp;A</span></a>
        <a class="tool" href="/snoop/admin" data-what="Notes and transcripts of every Google Meet, kept in one place."><span class="n">snoop</span><span class="by">remember calls</span></a>
    </nav>
    <p class="what" id="what" aria-live="polite"></p>
    <script>
    // The badger blinks every few seconds, now and then twice, and
    // sometimes winks one eye instead.
    (function () {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var lids = document.querySelectorAll('.lid');
        function play(els, cls) {
            els.forEach(function (el) {
                el.classList.remove('blink', 'wink');
                void el.offsetWidth; // restart the animation
                el.classList.add(cls);
            });
        }
        function next() {
            setTimeout(function () {
                var r = Math.random();
                if (r < 0.2) play([lids[Math.random() < 0.5 ? 0 : 1]], 'wink');
                else {
                    play(lids, 'blink');
                    if (r > 0.85) setTimeout(function () { play(lids, 'blink'); }, 420);
                }
                next();
            }, 2500 + Math.random() * 4500);
        }
        next();
    })();
    // Hover (or tab to) a tool: its sentence, one word after another.
    (function () {
        var what = document.getElementById('what'), shown = null;
        function show(a) {
            if (a === shown) return;
            shown = a;
            what.textContent = '';
            if (!a) return;
            a.dataset.what.split(' ').forEach(function (w, i) {
                var s = document.createElement('span');
                s.textContent = w;
                s.style.animationDelay = (i * 45) + 'ms';
                what.appendChild(s);
                what.appendChild(document.createTextNode(' '));
            });
        }
        document.querySelectorAll('.tool').forEach(function (a) {
            a.addEventListener('mouseenter', function () { show(a); });
            a.addEventListener('focus', function () { show(a); });
        });
        document.querySelector('.tools').addEventListener('mouseleave', function () { show(null); });
    })();
    </script>
</body>
</html>{{end}}
