name: Build and Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          export GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0
          VERSION="-X main.version=${{ github.ref_name }}"
          go build -ldflags "$VERSION" -o badger-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} .
          go build -ldflags "$VERSION" -o badger2-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./badger2
          go build -ldflags "$VERSION" -o snout-${{ matrix.goos }}-${{ matrix.goarch }}${EXT} ./scanner
      - uses: actions/upload-artifact@v4
        with:
          name: badger-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            badger-*
            badger2-*
            snout-*
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          # Tags with a dash (v2.0.0-alpha.1) are pre-releases, so GitHub's
          # "latest" stays on the old Badger while 2.0 is in beta.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            badger-*/badger-*
            badger-*/badger2-*
            badger-*/snout-*
