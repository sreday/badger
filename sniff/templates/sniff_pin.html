<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Speaker PIN · {{.Conf}}</title>
<link rel="icon" type="image/png" href="/assets/badger-favicon.png">
<style>
/* Sniff, the speaker page's PIN: one box, asked once per phone. No web
   fonts, works without JavaScript. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--c:#713660;--ink:#141c25;--mut:#5b6876;--bg:#f4f1f5;--line:rgba(20,28,37,.1)}
.llmday{--c:#26986A;--bg:#eef6f2}.platformday{--c:#c27a0e;--bg:#fbf4e8}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}
.top{background:var(--c);color:#fff;padding:18px 16px 20px}
.top>div{max-width:440px;margin:0 auto}
.conf{font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
h1{font-size:1.3rem;line-height:1.2;margin:6px 0 4px}
.who{font-size:.92rem;opacity:.9}
main{max-width:440px;margin:0 auto;padding:28px 16px}
form{background:#fff;border-radius:18px;padding:22px 18px;border:1px solid var(--line);text-align:center}
label{display:block;font-weight:800;margin-bottom:14px}
input{width:8.5em;text-align:center;font:inherit;font-size:1.8rem;font-weight:800;letter-spacing:.3em;padding:10px;border-radius:14px;border:1px solid rgba(20,28,37,.18)}
button{display:block;margin:16px auto 0;font:inherit;font-weight:800;color:#fff;background:var(--c);border:0;border-radius:999px;padding:12px 30px;cursor:pointer}
.hint{margin-top:14px;font-size:.82rem;color:var(--mut)}
.err{margin-bottom:14px;padding:10px 12px;border-radius:12px;font-size:.88rem;font-weight:600;background:#fde8e6;color:#9b1c13}
</style>
</head>
<body class="{{.Brand}}">
<header class="top"><div>
<div class="conf">{{.Conf}}</div>
<h1>{{if .S.Who}}{{.S.Who}}{{else}}{{.S.Title}}{{end}}</h1>
{{if .S.Who}}<div class="who">{{.S.Title}}</div>{{end}}
</div></header>
<main>
{{if .Err}}<div class="err">{{.Err}}</div>{{end}}
<form method="post" action="/sniff/{{.Link}}/pin">
<label for="pin">Speaker PIN</label>
<input id="pin" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" required autofocus>
<button>Open Q&amp;A Dashboard</button>
<p class="hint">The same PIN for every speaker, from the organisers. This phone remembers it.</p>
</form>
</main>
</body>
</html>
