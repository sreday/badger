<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sniff · {{.S.Title}}</title>
<link rel="icon" type="image/png" href="/assets/badger-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Sniff, the speaker's desktop page: every question and
   rating and who asked, to follow up. Live
   hearts and hides happen on the phone; this page has them too. */
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#141c25;--muted:#4b5a6b;--accent:#713660;--accent-rgb:113,54,96}
.llmday{--accent:#26986A;--accent-rgb:38,152,106}.platformday{--accent:#E2971D;--accent-rgb:226,151,29}
body{font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);background:#f0f6fa;min-height:100vh}
.sweep{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.7;background:
 linear-gradient(115deg,transparent 4%,rgba(113,54,96,.3) 14%,transparent 26%),
 linear-gradient(115deg,transparent 28%,rgba(38,152,106,.25) 40%,transparent 52%),
 linear-gradient(115deg,transparent 54%,rgba(107,64,216,.25) 66%,transparent 78%),
 linear-gradient(115deg,transparent 78%,rgba(226,151,29,.28) 90%,transparent 100%)}
.glass{border-radius:22px;background:linear-gradient(140deg,rgba(255,255,255,.7),rgba(255,255,255,.4) 45%,rgba(255,255,255,.55));
 -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);border:1px solid rgba(255,255,255,.8);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 12px 32px -10px rgba(var(--accent-rgb),.25)}
button,.btn{font:inherit;cursor:pointer;border:0;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:22px 20px 70px;display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:start}
@media(max-width:820px){main{grid-template-columns:1fr}.side{max-width:280px;margin:0 auto}}
{{template "shardcss"}}
.side{position:sticky;top:20px;display:flex;flex-direction:column;gap:12px}
.back{font-weight:700;font-size:.85rem;color:var(--muted);text-decoration:none}
.meta{font-size:.82rem;font-weight:600;color:var(--muted);text-align:center}
.kick{font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.note{padding:14px 18px;margin-bottom:14px;font-weight:600;font-size:.9rem;line-height:1.5}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.85);width:max-content;max-width:100%}
.tabs button{padding:9px 18px;border-radius:999px;background:none;font-weight:700;font-size:.9rem;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.tabs .n{opacity:.7;font-weight:600}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 12px}
.sp{flex:1}
.pill{text-decoration:none;padding:9px 15px;border-radius:999px;font-weight:700;font-size:.82rem;background:rgba(255,255,255,.75);border:1px solid rgba(20,28,37,.08);color:var(--ink)}
.pill.on{background:var(--ink);color:#fff}
.pill.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.q{display:flex;gap:14px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95);margin-bottom:10px;box-shadow:0 6px 18px -12px rgba(var(--accent-rgb),.5)}
.q.hid{opacity:.45;background:rgba(255,255,255,.4)}
.q.heart{background:#fff1f2;border-color:#fecdd3}
.votes{flex:none;width:52px;text-align:center;font-family:'Anton',sans-serif;font-size:1.5rem;line-height:1;padding-top:4px;color:var(--accent)}
.votes small{display:block;font-family:'Montserrat',sans-serif;font-size:.6rem;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.qt{flex:1;min-width:0;font-size:1rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.who{margin-top:6px;font-size:.82rem;font-weight:600;color:var(--muted);line-height:1.5}
.who b{color:var(--ink)}
.who a{color:var(--accent);font-weight:800;text-decoration:none}
.tag{display:inline-block;font-size:.64rem;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px;background:#fef3c7;color:#92400e;vertical-align:1px}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}
.acts button{padding:7px 11px;border-radius:10px;font-size:.76rem;font-weight:700;background:rgba(255,255,255,.85);border:1px solid rgba(20,28,37,.1);color:var(--ink)}
.acts .on{background:#e11d48;color:#fff;border-color:#e11d48}
.empty{text-align:center;color:var(--muted);font-weight:600;padding:36px 10px}
.fb{display:grid;grid-template-columns:200px 1fr;gap:16px;margin-bottom:16px}
@media(max-width:620px){.fb{grid-template-columns:1fr}}
.avg{padding:20px;text-align:center}
.avg .big{font-family:'Anton',sans-serif;font-size:4rem;line-height:1;color:var(--accent)}
.avg .of{font-weight:700;color:var(--muted);font-size:.85rem;margin-top:6px}
.dist{padding:16px 20px}
.dl{display:flex;align-items:center;gap:10px;margin:6px 0;font-weight:700;font-size:.85rem}
.dl .f{width:52px;font-size:1rem;color:#e2971d;letter-spacing:-.04em}
.dl .t{flex:1;height:12px;border-radius:999px;background:rgba(20,28,37,.08);overflow:hidden}
.dl .t i{display:block;height:100%;background:var(--accent);border-radius:999px}
.dl .c{width:28px;text-align:right;color:var(--muted)}
[hidden]{display:none!important}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:.85rem;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
</style>
</head>
<body class="{{.Brand}}">
<div class="sweep"></div>
<main>
<aside class="side">
{{if .Back}}<a class="back" href="{{.Back}}">← All speakers</a>{{end}}
{{template "shardcard" .Card}}
<div class="meta"><div class="kick">{{.Conf}}</div>{{if .When}}{{.When}}{{end}}</div>
</aside>
<section>
<div class="note glass">Sniff matches each question with the attendee list, so you can see who asked and follow up. Download it all any time.</div>
<nav class="tabs"><button data-t="q" class="on">Questions <span class="n" id="nq"></span></button><button data-t="f">Feedback <span class="n" id="nf"></span></button></nav>
<div class="bar"><span class="sp"></span><button class="pill" id="oHid">Show hidden</button><a class="pill acc" href="/sniff/{{.S.Token}}/export.csv">Download questions + feedback (.CSV)</a></div>
<div id="tq"><div id="qs"></div></div>
<div id="tf" hidden>
<div class="fb"><div class="avg glass"><div class="big" id="avg">–</div><div class="of" id="of">No ratings yet</div></div><div class="dist glass" id="dist"></div></div>
<div id="cm"></div>
</div>
</section>
</main>
<div id="toast"></div>
<script>
(function(){
var TOK={{.S.Token}},D={{.Init}},showHid=false;
var $=function(id){return document.getElementById(id)};
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function toast(t){var x=$('toast');x.textContent=t;x.className='on';clearTimeout(toast.t);toast.t=setTimeout(function(){x.className=''},1800)}
function req(method,url,body){return new Promise(function(ok,no){var x=new XMLHttpRequest();x.open(method,url);x.timeout=8000;
  if(body)x.setRequestHeader('Content-Type','application/json');x.onload=function(){ok(x)};x.onerror=x.ontimeout=no;x.send(body?JSON.stringify(body):null)})}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.tabs button').forEach(function(o){o.className=o==b?'on':''});
  ['q','f'].forEach(function(t){$('t'+t).hidden=t!=b.dataset.t})}});
// Who asked: after the event, the attendee it matched; else what they typed.
function who(x){var w=el('div','who');
  if(x.who){var nm=[x.who.fn,x.who.ln].filter(Boolean).join(' ')||x.n;w.appendChild(el('b',null,nm));
    var rest=[x.who.t,x.who.c].filter(Boolean).join(', ');if(rest)w.appendChild(document.createTextNode(' · '+rest));
    if(x.who.e){w.appendChild(document.createTextNode(' · '));var m=el('a',null,x.who.e);m.href='mailto:'+x.who.e;w.appendChild(m)}
    if(x.who.li){w.appendChild(document.createTextNode(' · '));var a=el('a',null,'LinkedIn');a.href=x.who.li;a.target='_blank';a.rel='noopener';w.appendChild(a)}
    if(x.n&&x.n!=nm)w.title='They typed "'+x.n+'"'}
  else w.appendChild(document.createTextNode(x.n||'Anonymous'));
  if(x.x)w.appendChild(el('span','tag','TEST'));return w}
var FLAG={hide:['h',true],show:['h',false],important:['i',true],unimportant:['i',false]};
function mod(q,m){q[FLAG[m][0]]=FLAG[m][1];render();
  req('POST','/sniff/'+TOK+'/mod',{q:q.id,mod:m}).then(function(x){if(x.status!=200)toast('That didn\'t save');poll(true)},function(){toast('No connection, try again')})}
function render(){
  $('nq').textContent=D.qs.filter(function(q){return !q.h}).length||'';
  var box=$('qs');box.textContent='';
  var qs=D.qs.filter(function(q){return showHid||!q.h}).sort(function(a,b){return(!!b.i-!!a.i)||(b.v-a.v)||(a.at-b.at)});
  if(!qs.length)box.appendChild(el('div','empty glass','No questions yet.'));
  qs.forEach(function(q){var c=el('div','q'+(q.h?' hid':'')+(q.i?' heart':''));
    var v=el('div','votes',q.v);v.appendChild(el('small',null,q.v==1?'VOTE':'VOTES'));
    var t=el('div','qt',q.t);t.appendChild(who(q));
    var a=el('div','acts'),h=el('button',q.i?'on':'',q.i?'♥ On top':'♡ Heart'),x=el('button',null,q.h?'Show':'Hide');
    h.onclick=function(){mod(q,q.i?'unimportant':'important')};x.onclick=function(){mod(q,q.h?'show':'hide')};
    a.appendChild(h);a.appendChild(x);c.appendChild(v);c.appendChild(t);c.appendChild(a);box.appendChild(c)});
  var rs=D.rs,n=rs.length,sum=0,cnt=[0,0,0,0];rs.forEach(function(r){sum+=r.s;cnt[r.s]++});
  $('nf').textContent=n?(sum/n).toFixed(1)+' ★':'';
  $('avg').textContent=n?(sum/n).toFixed(1):'–';$('of').textContent=n?'out of 3 · '+n+(n==1?' rating':' ratings'):'No ratings yet';
  var dist=$('dist');dist.textContent='';var stars=['','★','★★','★★★'];
  for(var s=3;s>=1;s--){var row=el('div','dl');row.appendChild(el('span','f',stars[s]));var tr=el('span','t'),i=el('i');i.style.width=(n?cnt[s]/n*100:0)+'%';tr.appendChild(i);
    row.appendChild(tr);row.appendChild(el('span','c',cnt[s]));dist.appendChild(row)}
  var cm=$('cm');cm.textContent='';
  rs.filter(function(r){return r.c||r.who}).forEach(function(r){var c=el('div','q');var v=el('div','votes',stars[r.s]);v.style.fontSize='1rem';v.style.color='#e2971d';
    var t=el('div','qt',r.c||'');t.appendChild(who(r));c.appendChild(v);c.appendChild(t);cm.appendChild(c)})}
$('oHid').onclick=function(){showHid=!showHid;this.className='pill'+(showHid?' on':'');render()};
function poll(now){if(document.hidden&&!now)return;
  req('GET','/sniff/'+TOK+'/feed?v='+encodeURIComponent(D.v)).then(function(x){if(x.status==200){D=JSON.parse(x.responseText);render()}},function(){})}
setInterval(poll,10000);document.addEventListener('visibilitychange',function(){if(!document.hidden)poll(true)});
render();
})();
</script>
</body>
</html>
