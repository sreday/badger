{{/* The tool's name next to the badger head, linking back to the hub.
     Used as {{template "brand" (tool "snout" "by badger")}} plus
     {{template "brandcss"}} inside the page's <style>; the page loads
     Fredoka. */}}
{{define "brand"}}<a class="brand" href="/" title="All Badger tools"><img src="/assets/badger-head.png" alt=""><span class="t"><span class="bn">{{.Name}}{{if .Ver}}<small>{{.Ver}}</small>{{end}}</span><span class="by">{{.Sub}}</span></span></a>{{end}}
{{/* brandplain is the same mark without the link, for pages people outside
     the team see (Sniff's event page). */}}
{{define "brandplain"}}<span class="brand"><img src="/assets/badger-head.png" alt=""><span class="t"><span class="bn">{{.Name}}</span><span class="by">{{.Sub}}</span></span></span>{{end}}
{{define "brandcss"}}
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: #111; }
    .brand img { height: 56px; width: auto; display: block; }
    .brand .t { display: flex; flex-direction: column; font-family: 'Fredoka', sans-serif; }
    .brand .bn { font-weight: 700; font-size: 2.5rem; line-height: .9; letter-spacing: -.01em; }
    .brand .bn small { font-size: .5em; vertical-align: .45em; margin-left: .12em; }
    .brand .by { font-weight: 600; font-size: .95rem; line-height: 1.15; margin-left: 2px; }
{{end}}
{{/* Buttons to the other Badger tools, for the admin pages only: never on
     sponsor-, speaker- or audience-facing pages. Used as
     {{template "apps" "snout"}} (the current tool is left out) plus
     {{template "appscss"}} inside the page's <style>. */}}
{{define "apps"}}<nav class="apps">
{{- if ne . "snug"}}<a class="app" href="/snug/" title="Snug: print the badges, no install"><span class="n">snug</span><span class="by">print badges</span></a>{{end}}
{{- if ne . "snout"}}<a class="app" href="/snout" title="Snout: sponsors and lead scanners"><span class="n">snout</span><span class="by">scan badges</span></a>{{end}}
{{- if ne . "sniff"}}<a class="app" href="/sniff" title="Sniff: audience questions and feedback per session"><span class="n">sniff</span><span class="by">live Q&amp;A</span></a>{{end}}
{{- if ne . "snoop"}}<a class="app" href="/snoop/" title="Snoop: notes and transcripts of every Google Meet"><span class="n">snoop</span><span class="by">monitor meetings</span></a>{{end}}
</nav>{{end}}
{{define "appscss"}}
    /* The hub's tool cards (hub.html .tool), small: Fredoka wordmark, what
       it does underneath, the logo's orange scan-frame corners. Every
       button to another Badger tool looks like this (Marek 2026-11-08). */
    .apps { display: flex; gap: 10px; flex-wrap: wrap; }
    .apps .app { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
                 padding: 6px 14px 7px; border-radius: 12px; background: rgba(255,255,255,.55); color: #111; text-decoration: none;
                 font-family: 'Fredoka', sans-serif; white-space: nowrap; transition: background .15s; }
    .apps .app .n { font-weight: 700; font-size: 1.3rem; line-height: 1; letter-spacing: -.01em; }
    .apps .app .n small { font-size: .55em; vertical-align: .35em; margin-left: .15em; }
    .apps .app .by { font-weight: 600; font-size: .68rem; line-height: 1.2; opacity: .85; }
    .apps .app::before, .apps .app::after { content: ""; position: absolute; width: 12px; height: 12px; border: 3px solid #ec7a2c; transition: top .15s, left .15s, bottom .15s, right .15s; }
    .apps .app::before { top: 0; left: 0; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
    .apps .app::after { bottom: 0; right: 0; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
    .apps .app:hover, .apps .app:focus-visible { background: #fff; outline: none; text-decoration: none; }
    .apps .app:hover::before, .apps .app:focus-visible::before { top: -4px; left: -4px; }
    .apps .app:hover::after, .apps .app:focus-visible::after { bottom: -4px; right: -4px; }
    @media (max-width: 1100px) { .apps .app .by { display: none; } }
    @media (max-width: 760px) { .apps .app { padding: 6px 10px; } .apps .app .by { display: none; } .apps .app .n { font-size: 1.05rem; } }
{{end}}
