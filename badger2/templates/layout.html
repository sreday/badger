{{define "printer"}}
<div class="card printer">
    <div class="row">
        <strong>Printers</strong>
        <div class="chips" id="pChips" role="group" aria-label="Printers to print to"></div>
    </div>
    <ul class="jobs" id="pJobs"></ul>
</div>
{{end}}
{{define "layout"}}<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Badger 2.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { margin-bottom: 10px; }
        h3 { margin-bottom: 8px; font-weight: normal; color: #666; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        ul { list-style: none; padding: 0; }
        li { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        li:last-child { border-bottom: none; }
        .pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            text-decoration: none;
            margin-left: 8px;
        }
        .pill:hover { text-decoration: none; opacity: 0.8; }
        .pill-blue { background: #dbeafe; color: #1d4ed8; }
        .pill-green { background: #dcfce7; color: #166534; }
        .pill-red { background: #fee2e2; color: #991b1b; }
        .flagged { color: #dc2626; }
        li[hidden] { display: none; }
        input[type="text"], input[type="email"], input[type="url"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1em;
            margin-bottom: 12px;
        }
        label { display: block; font-weight: 500; margin-bottom: 4px; }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }

        /* Printer panel: the one printer, its state, and its jobs. */
        .printer { position: sticky; top: 0; z-index: 5; }
        .printer .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .chip { display: inline-flex; align-items: center; gap: 8px; margin: 0; padding: 5px 8px 5px 10px; border-radius: 999px;
                border: 1px solid #d1d5db; background: #fff; color: #6b7280; font-weight: 600; cursor: pointer; }
        .chip.on { border-color: #93c5fd; background: #eff6ff; color: #111827; }
        .chip input { margin: 0; accent-color: #2563eb; }
        .chip .state { padding: 1px 9px; font-size: .8em; }
        .chip .queue { font-size: .8em; color: #6b7280; font-weight: 500; }
        .state { display: inline-flex; align-items: center; gap: 7px; padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: .9em; }
        .state::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
        .state.printing { background: #dbeafe; color: #1d4ed8; }
        .state.printing::before { animation: blink 1s infinite; }
        .state.idle { background: #dcfce7; color: #166534; }
        .state.off { background: #fee2e2; color: #991b1b; }
        .state.none, .state.unknown { background: #f3f4f6; color: #6b7280; }
        @keyframes blink { 50% { opacity: .25; } }
        .printer .detail { color: #6b7280; font-size: .9em; }
        .jobs { margin-top: 12px; max-height: 210px; overflow-y: auto; }
        .jobs li { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; font-size: .95em; }
        .jobs .st { width: 76px; flex: none; font-size: .8em; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
        .jobs .st.queued { color: #b45309; }
        .jobs .st.printing { color: #1d4ed8; }
        .jobs .st.printed { color: #166534; }
        .jobs .st.failed { color: #991b1b; }
        .jobs .who { flex: 1; }
        .jobs .meta { color: #9ca3af; font-size: .85em; }
        .jobs li.new { background: #fef9c3; }
        .jobs .empty { color: #9ca3af; }
        a.busy { opacity: .5; pointer-events: none; }

        /* Guest search */
        .search { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .search input { flex: 1; margin: 0; padding: 12px 16px; font-size: 1.15em; border: 2px solid #2563eb; border-radius: 10px; outline: none; }
        .search .count { color: #6b7280; font-size: .9em; white-space: nowrap; }
        li.only { background: #eff6ff; }
        li.nomatch { color: #9ca3af; }
        .walkmsg { margin-left: 12px; color: #6b7280; }
        .tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 10px; background: #f3f4f6; }
        .tab { background: none; color: #374151; padding: 8px 22px; border-radius: 8px; font-weight: 600; }
        .tab:hover { background: #e5e7eb; }
        .tab.on { background: #fff; color: #111827; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
        form[hidden] { display: none; }
        input.copies { width: 110px; }
        input[type="number"] { padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1em; margin-bottom: 12px; display: block; }
        .ghostbtn { background: #fff; color: #2563eb; border: 1px solid #2563eb; margin-right: 6px; }
        .ghostbtn:hover { background: #eff6ff; }
        .kinds { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
        .kinds label { margin: 0; font-weight: 600; }
        .kinds input { position: absolute; opacity: 0; pointer-events: none; }
        .kinds span { display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; }
        .kinds input:checked + span { background: #2563eb; border-color: #2563eb; color: #fff; }
        .kinds input:focus-visible + span { outline: 2px solid #93c5fd; outline-offset: 2px; }
        .kindnote { color: #6b7280; font-size: .9em; margin-bottom: 14px; min-height: 1.4em; }
        [data-for][hidden] { display: none; }
        .wifiimg { display: block; width: 100%; max-width: 500px; margin-top: 16px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0, 0, 0, .15); }
    </style>
</head>
<body>
<div class="container">
    {{template "content" .}}
</div>
{{if .ShowPrinter}}
<script>
(function () {
    // The printer panel: state and jobs every 3 seconds. Print buttons send
    // the job here and show it straight away.
    const $ = (id) => document.getElementById(id);
    const LABEL = { printing: 'Printing', idle: 'Idle', off: 'Off', none: 'No printer', unknown: 'Unknown' };
    let fresh = new Set();
    function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
    }
    function time(t) {
        const d = new Date(t);
        return isNaN(d) || d.getFullYear() < 2000 ? '' : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    // One chip per printer this computer knows: on (printing to it, with
    // its state and queue) or off. Badges go to the switched-on printer with
    // the shortest queue that isn't off.
    function render(info) {
        const box = $('pChips');
        box.textContent = '';
        const on = new Map(info.on.map((p) => [p.name, p]));
        const names = [...new Set([...info.on.map((p) => p.name), ...info.printers])];
        if (!names.length) box.append(el('span', 'detail', 'No printers found on this computer.'));
        for (const n of names) {
            const p = on.get(n);
            const chip = el('label', 'chip' + (p ? ' on' : ''));
            const cb = el('input');
            cb.type = 'checkbox';
            cb.checked = !!p;
            cb.value = n;
            chip.append(cb, el('span', 'pname', n.replace(/_/g, ' ')));
            if (p) {
                chip.append(el('span', 'state ' + p.state, LABEL[p.state] || p.state));
                if (p.queue) chip.append(el('span', 'queue', p.queue + ' in queue'));
                if (p.detail) chip.title = p.detail;
            }
            box.append(chip);
        }
        const detail = info.on.filter((p) => p.detail).map((p) => p.name.replace(/_/g, ' ') + ': ' + p.detail);
        if (detail.length) box.append(el('span', 'detail', detail.join(' · ')));
        const two = info.on.length > 1;
        const ul = $('pJobs');
        ul.textContent = '';
        if (!info.jobs.length) ul.append(el('li', 'empty', 'No print jobs yet.'));
        for (const j of info.jobs) {
            const li = el('li', fresh.has(j.id || j.at) ? 'new' : '');
            li.append(el('span', 'st ' + j.status, j.status), el('span', 'who', j.name || 'Other job'),
                      el('span', 'meta', [j.error, two && j.printer ? j.printer.replace(/_/g, ' ') : '', j.id ? 'job ' + j.id.split('-').pop() : '', time(j.at)].filter(Boolean).join(' · ')));
            ul.append(li);
        }
    }
    async function refresh() {
        try {
            const r = await fetch('/printer', { cache: 'no-store' });
            if (r.ok) render(await r.json());
        } catch (e) {}
    }
    $('pChips').addEventListener('change', async () => {
        const picked = [...$('pChips').querySelectorAll('input:checked')].map((c) => c.value);
        if (!picked.length) { refresh(); return; } // at least one stays on
        const body = new URLSearchParams();
        for (const n of picked) body.append('printers', n);
        const r = await fetch('/printer', { method: 'POST', body });
        if (r.ok) render(await r.json());
    });
    // Print buttons: send, then show the new job at the top of the list.
    document.addEventListener('click', async (e) => {
        const a = e.target.closest('a[data-print]');
        if (!a) return;
        e.preventDefault();
        if (a.dataset.print === 'all' && !confirm('Print every badge for this event?')) return;
        a.classList.add('busy');
        try {
            const r = await fetch(a.getAttribute('href'), { method: 'POST' });
            const d = await r.json();
            for (const j of (d.jobs || [d])) fresh.add(j.id || j.at);
            setTimeout(() => { fresh = new Set(); refresh(); }, 6000);
        } catch (err) {}
        a.classList.remove('busy');
        refresh();
    });
    refresh();
    setInterval(refresh, 3000);
})();
</script>
{{end}}
</body>
</html>{{end}}
