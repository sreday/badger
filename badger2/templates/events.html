{{define "content"}}
<h1>Events</h1>
<h3><a href="/logout">logout</a></h3>

{{if .Error}}<div class="error">{{.Error}}</div>{{end}}

{{if .Upcoming}}
<h3>Upcoming</h3>
<div class="card">
    <ul>
        {{range .Upcoming}}
        <li><a href="/event/{{.Event.APIId}}">{{.Event.Name}}</a></li>
        {{end}}
    </ul>
</div>
{{end}}

{{if .Past}}
<details>
    <summary><h3 style="display:inline;">Past</h3></summary>
    <div class="card" style="margin-top:8px;">
        <ul>
            {{range .Past}}
            <li><a href="/event/{{.Event.APIId}}">{{.Event.Name}}</a></li>
            {{end}}
        </ul>
    </div>
</details>
{{end}}

{{end}}

{{template "layout" .}}
