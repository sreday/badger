{{define "layout"}}<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Badger</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { margin-bottom: 10px; }
        h3 { margin-bottom: 8px; font-weight: normal; color: #666; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 16px;
        }
        .error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
        }
        ul { list-style: none; padding: 0; }
        li { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        li:last-child { border-bottom: none; }
        .pill {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            text-decoration: none;
            margin-left: 8px;
        }
        .pill:hover { text-decoration: none; opacity: 0.8; }
        .pill-blue { background: #dbeafe; color: #1d4ed8; }
        .pill-green { background: #dcfce7; color: #166534; }
        .pill-red { background: #fee2e2; color: #991b1b; }
        .flagged { color: #dc2626; }
        input[type="text"], input[type="email"], input[type="url"] {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1em;
            margin-bottom: 12px;
        }
        label { display: block; font-weight: 500; margin-bottom: 4px; }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
<div class="container">
    {{template "content" .}}
</div>
</body>
</html>{{end}}
